# /etc/nginx/sites-available/aiproducts.analytx4t.com
# Static files are published by deploy/deploy.sh into $PUBLIC with the same
# layout as the URLs:
#   $PUBLIC/              -> portal + marketing site (web/dist)
#   $PUBLIC/app/<slug>/ -> each product frontend (Trial Balance = financial-reporting, GST = gst-reconciliation, …)
# APIs are reverse-proxied per product under /app/<slug>/api/.
# Run `certbot --nginx -d aiproducts.analytx4t.com` once; it adds the 443 block.

server {
    listen 80;
    listen [::]:80;
    server_name aiproducts.analytx4t.com;

    root /var/www/aiproducts/public;
    index index.html;

    # gzip for text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Portal embeds sub-apps in an iframe — same origin only.
    add_header X-Frame-Options SAMEORIGIN always;

    # ---------------- Financial Reporting ----------------
    # old address (before the rename) keeps working
    location ~ ^/app/eldeco(/.*)?$ { return 301 /app/financial-reporting$1$is_args$args; }
    # API: /app/financial-reporting/api/x  ->  http://127.0.0.1:8000/api/x
    location ^~ /app/financial-reporting/api/ {   # ^~ : never let the regex rules below catch API calls
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;     # trial-balance uploads
        proxy_read_timeout 300s;      # AI classification can be slow
        proxy_send_timeout 300s;
    }

    # SPA: unknown paths under /app/financial-reporting/ fall back to its index.html
    location /app/financial-reporting/ {
        try_files $uri $uri/ /app/financial-reporting/index.html;
    }

    # ---------------- Bank Reconciliation ----------------
    location ^~ /app/bank-reconciliation/api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout 300s;      # reconciliation + streaming chat
        proxy_buffering off;          # stream chat tokens (SSE)
    }
    location /app/bank-reconciliation/ {
        try_files $uri $uri/ /app/bank-reconciliation/index.html;
    }

    # ---------------- Virtual CFO ----------------
    location ^~ /app/virtual-cfo/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64m;     # four statement PDFs
        proxy_read_timeout 300s;      # extraction + streaming chat
        proxy_buffering off;          # stream chat tokens as they arrive (SSE)
    }
    location /app/virtual-cfo/ {
        try_files $uri $uri/ /app/virtual-cfo/index.html;
    }

    # ---------------- Invoice Automation ----------------
    location ^~ /app/invoice-automation/api/ {
        proxy_pass http://127.0.0.1:8003/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;    # up to 100 invoice PDFs per batch
        proxy_read_timeout 600s;
        proxy_buffering off;          # stream chat tokens (SSE)
    }
    location /app/invoice-automation/ {
        try_files $uri $uri/ /app/invoice-automation/index.html;
    }

    # ---------------- GST Reconciliation (FastAPI) ----------------
    location ^~ /app/gst-reconciliation/api/ {
        proxy_pass http://127.0.0.1:8004/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;    # full annual source package
        proxy_read_timeout 600s;      # AI layout mapping + calculations
        proxy_send_timeout 600s;
        proxy_buffering off;          # stream chat tokens as they arrive (SSE)
    }
    location /app/gst-reconciliation/ {
        try_files $uri $uri/ /app/gst-reconciliation/index.html;
    }

    # Hashed build assets: cache for a year
    location ~* /assets/.+\.(?:js|css|woff2?|png|jpe?g|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML must always revalidate so deploys show up immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # ---------------- Portal / marketing site ----------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
